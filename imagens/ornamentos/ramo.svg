<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" aria-hidden="true">
  <defs>
    <linearGradient id="folha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fbf7a"/>
      <stop offset="1" stop-color="#2f6f4e"/>
    </linearGradient>
    <linearGradient id="folha2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7d39a"/>
      <stop offset="1" stop-color="#5a9466"/>
    </linearGradient>
    <path id="f" d="M0 0 C 10 -12, 34 -12, 46 0 C 34 12, 10 12, 0 0 Z"/>
    <g id="flor-amarela">
      <g fill="#f2c14e">
        <ellipse cx="0" cy="-9" rx="5.5" ry="9"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9" transform="rotate(72)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9" transform="rotate(144)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9" transform="rotate(216)"/>
        <ellipse cx="0" cy="-9" rx="5.5" ry="9" transform="rotate(288)"/>
      </g>
      <circle r="4.5" fill="#e07a2f"/>
    </g>
    <g id="flor-roxa">
      <g fill="#9b6fc2">
        <ellipse cx="0" cy="-8" rx="5" ry="8"/>
        <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(72)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(144)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(216)"/>
        <ellipse cx="0" cy="-8" rx="5" ry="8" transform="rotate(288)"/>
      </g>
      <circle r="3.6" fill="#f2c14e"/>
    </g>
  </defs>

  <!-- haste -->
  <path d="M10 190 C 60 150, 110 120, 170 96 C 210 80, 250 60, 292 20" stroke="#4d7f5c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M120 128 C 130 100, 150 82, 178 66" stroke="#4d7f5c" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- folhas -->
  <use href="#f" fill="url(#folha)" transform="translate(40 166) rotate(-80)"/>
  <use href="#f" fill="url(#folha2)" transform="translate(52 158) rotate(10)"/>
  <use href="#f" fill="url(#folha)" transform="translate(90 136) rotate(-95)"/>
  <use href="#f" fill="url(#folha2)" transform="translate(104 128) rotate(5)"/>
  <use href="#f" fill="url(#folha)" transform="translate(150 106) rotate(-100)"/>
  <use href="#f" fill="url(#folha2)" transform="translate(168 98) rotate(-5)"/>
  <use href="#f" fill="url(#folha)" transform="translate(212 76) rotate(-110)"/>
  <use href="#f" fill="url(#folha2)" transform="translate(228 66) rotate(-20)"/>
  <use href="#f" fill="url(#folha)" transform="translate(262 44) rotate(-120)" opacity="0.9"/>
  <use href="#f" fill="url(#folha2)" transform="translate(140 96) rotate(-60) scale(0.8)"/>

  <!-- botões -->
  <ellipse cx="292" cy="18" rx="4" ry="7" fill="#c98ad0" transform="rotate(40 292 18)"/>
  <ellipse cx="183" cy="62" rx="3.5" ry="6" fill="#f2c14e" transform="rotate(50 183 62)"/>

  <!-- flores -->
  <use href="#flor-amarela" transform="translate(178 66) scale(1.15)"/>
  <use href="#flor-roxa" transform="translate(246 58)"/>
  <use href="#flor-amarela" transform="translate(76 146) scale(0.85)"/>
  <use href="#flor-roxa" transform="translate(122 126) scale(0.8)"/>
</svg>
